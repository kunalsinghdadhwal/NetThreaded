name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build for Linux
        run: |
          make clean || true
          make

      - name: Create Linux archive
        run: |
          mkdir -p dist
          cp proxy dist/proxy-linux-amd64
          cd dist && sha256sum proxy-linux-amd64 > proxy-linux-amd64.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build for Windows
        run: |
          x86_64-w64-mingw32-g++ -o proxy.exe proxy_parse.c proxy_server_cache.c -lws2_32 -static -lpthread

      - name: Create Windows archive
        run: |
          mkdir -p dist
          cp proxy.exe dist/proxy-windows-amd64.exe
          cd dist && sha256sum proxy-windows-amd64.exe > proxy-windows-amd64.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-dist/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp linux-dist/* release/
          cp windows-dist/* release/
          cd release && cat *.sha256 > checksums.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/proxy-linux-amd64
            release/proxy-linux-amd64.sha256
            release/proxy-windows-amd64.exe
            release/proxy-windows-amd64.exe.sha256
            release/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
